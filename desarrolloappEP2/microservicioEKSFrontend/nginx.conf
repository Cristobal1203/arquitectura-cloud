server {
    listen 80;
    server_name localhost;

    # Archivos estaticos del frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # GET /api/products y GET /api/products/:id -> get-products (Service K8s)
    location ~ ^/api/products$ {
        if ($request_method = POST) {
            proxy_pass http://create-product.freshbox.svc.cluster.local:3002;
        }
        proxy_pass http://get-products.freshbox.svc.cluster.local:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # PUT /api/products/:id -> update-product (Service K8s)
    # DELETE /api/products/:id -> delete-product (Service K8s)
    location ~ ^/api/products/(\d+)$ {
        if ($request_method = PUT) {
            proxy_pass http://update-product.freshbox.svc.cluster.local:3003;
        }
        if ($request_method = DELETE) {
            proxy_pass http://delete-product.freshbox.svc.cluster.local:3004;
        }
        # GET por id -> get-products
        proxy_pass http://get-products.freshbox.svc.cluster.local:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
